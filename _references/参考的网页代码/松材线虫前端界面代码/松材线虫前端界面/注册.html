<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清远市松材线虫病灾害监测预警系统 - 用户注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url(image/松问背景图.png);
            overflow: hidden;
        }

        .logo {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .system-title {
            position: absolute;
            top: 50%;
            left: 180px;
            transform: translateY(-50%);
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            text-align: center;
        }

        .system-title h1 {
            font-size: 48px;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .register-container {
            width: 400px;
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: absolute;
            top: 50%;
            right: 100px;
            transform: translateY(-50%);
        }

        .register-title {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 15px 15px 50px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            color: #333;
            background-color: white;
        }

        .input-group input:focus {
            outline: none;
            border-color: #0a6aa1;
            box-shadow: 0 0 0 2px rgba(10, 106, 161, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 20px;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            cursor: pointer;
            font-size: 20px;
        }

        .captcha-group {
            display: flex;
            gap: 10px;
        }

        .captcha-group input {
            flex: 1;
            padding: 15px;
        }

        .captcha-image {
            width: 120px;
            height: 48px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-style: italic;
            color: #333;
            letter-spacing: 2px;
            user-select: none;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }

        .captcha-image::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent 45%, #e0e0e0 45%, #e0e0e0 55%, transparent 55%);
            background-size: 10px 10px;
        }

        .register-btn {
            width: 100%;
            padding: 15px;
            background-color: #0a6aa1;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .register-btn:hover {
            background-color: #085a8a;
        }

        .register-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 14px;
        }

        .register-links a {
            color: #0a6aa1;
            text-decoration: none;
        }

        .register-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1200px) {
            .system-title {
                left: 50px;
            }

            .register-container {
                right: 50px;
            }
        }

        @media (max-width: 992px) {
            .system-title {
                display: none;
            }

            .register-container {
                right: 50%;
                transform: translate(50%, -50%);
            }
        }

        @media (max-width: 480px) {
            .register-container {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="system-title">
        <h1>清远市松材线虫病灾害<br><br>监测预警系统</h1>
    </div>

    <div class="register-container">
        <h2 class="register-title">用户注册</h2>

        <div class="input-group">
            <span class="input-icon">👤</span>
            <input type="text" placeholder="请输入用户名或手机号">
        </div>

        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="password" placeholder="请输入密码">
            <span class="toggle-password" id="togglePassword">👁️</span>
        </div>

        <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="confirmPassword" placeholder="请再次输入您的密码">
            <span class="toggle-password" id="toggleConfirmPassword">👁️</span>
        </div>

        <div class="input-group captcha-group">
            <input type="text" placeholder="请输入验证码">
            <div class="captcha-image" id="captchaImage">jepY</div>
        </div>

        <button class="register-btn" id="registerBtn">注册</button>

        <div class="register-links">
            <a href="#">新用户注册</a>
            <a href="#">登录遇到问题?</a>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const captchaImage = document.getElementById('captchaImage');
        const registerBtn = document.getElementById('registerBtn');

        // 切换密码可见性
        togglePassword.addEventListener('click', function () {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = '🔓';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = '👁️';
            }
        });

        // 切换确认密码可见性
        toggleConfirmPassword.addEventListener('click', function () {
            if (confirmPasswordInput.type === 'password') {
                confirmPasswordInput.type = 'text';
                toggleConfirmPassword.textContent = '🔓';
            } else {
                confirmPasswordInput.type = 'password';
                toggleConfirmPassword.textContent = '👁️';
            }
        });

        // 生成随机验证码
        function generateCaptcha() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let captcha = '';
            for (let i = 0; i < 4; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return captcha;
        }

        // 点击验证码刷新
        captchaImage.addEventListener('click', function () {
            captchaImage.textContent = generateCaptcha();
        });

        // 初始化验证码
        captchaImage.textContent = generateCaptcha();

        // 注册按钮点击事件
        registerBtn.addEventListener('click', function () {
            // 跳转到登录页面
            window.location.href = '登录.html';
        });
    </script>
</body>

</html>
