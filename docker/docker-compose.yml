services:
  postgres:
    image: postgis/postgis:15-3.4
    platform: linux/arm64
    container_name: pine_postgres
    environment:
      POSTGRES_DB: pine_wilt_db
      POSTGRES_USER: pine_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pine_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pine_user -d pine_wilt_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    container_name: pine_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-pine_redis_dev} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pine_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    platform: linux/arm64
    container_name: pine_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pine_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pine_minio_dev}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7-alpine
    platform: linux/arm64
    container_name: pine_influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-pine_influx}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-pine_influx_dev}
      DOCKER_INFLUXDB_INIT_ORG: pine-wilt
      DOCKER_INFLUXDB_INIT_BUCKET: iot-sensors
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-pine_influx_token_dev}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    ports:
      - "8086:8086"
    restart: unless-stopped

  emqx:
    image: emqx/emqx:5.3.0
    platform: linux/arm64
    container_name: pine_emqx
    environment:
      EMQX_NODE__NAME: emqx@pine_emqx
    volumes:
      - emqx_data:/opt/emqx/data
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  influxdb_data:
  emqx_data:
